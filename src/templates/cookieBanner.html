<!-- Cookie Consent Toast Banner -->
<div id="cookieBanner" class="cookie-banner">
  <div class="cookie-header">
    <img src="/logo.png" alt="Get Jakes" style="width:20px; height:20px; border-radius:50%;">
    <span>Get Jakes Cookie & Store Preferences</span>
  </div>
  <p style="font-size: 0.85rem; color: var(--text-secondary);">
    We use essential local storage to save your cart items, order history, and custom quote preferences.
  </p>
  <div class="cookie-actions">
    <button id="acceptCookiesBtn" class="btn-primary" style="padding: 6px 16px; font-size: 0.8rem;">Accept All</button>
    <button id="essentialCookiesBtn" class="btn-secondary" style="padding: 6px 14px; font-size: 0.8rem;">Essential Only</button>
  </div>
</div>
