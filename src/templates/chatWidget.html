<!-- Floating Live Chat Widget -->
<div class="chat-widget">
  <button id="chatTriggerBtn" class="chat-trigger" title="Live Get Jakes Assistant">
    <i data-lucide="message-square-text" style="width: 28px; height: 28px;"></i>
    <span class="chat-pulse-badge"></span>
  </button>
</div>

<div id="chatWindow" class="chat-window">
  <div class="chat-header">
    <div class="chat-agent-info">
      <img src="/logo.png" alt="Get Jakes" style="width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid #FFF;">
      <div>
        <strong style="font-size: 0.9rem; display: block; color:#0F1415;">Get Jakes Assistant</strong>
        <span style="font-size: 0.72rem; color:#0F1415; opacity: 0.85;">Online • Instant Replies</span>
      </div>
    </div>
    <button id="closeChatBtn" style="color: #0F1415;">
      <i data-lucide="x"></i>
    </button>
  </div>

  <div id="chatMessages" class="chat-body">
    <div class="chat-msg bot">
      Hello! 👋 Welcome to <strong>Get Jakes Cake Props & Toppers</strong>. How can I assist you with dummy cakes, custom toppers, photo props, or Bank Transfer orders today?
    </div>
    <div class="chat-faq-chips" id="chatFaqChips">
      <!-- Dynamic FAQ Chips -->
    </div>
  </div>

  <form id="chatForm" class="chat-footer">
    <input type="text" id="chatInput" class="chat-input" placeholder="Ask about props or bank payments..." required>
    <button type="submit" class="icon-btn" style="background: var(--color-black); color: var(--color-brand); width: 36px; height: 36px;">
      <i data-lucide="send" style="width: 16px; height: 16px;"></i>
    </button>
  </form>
</div>
